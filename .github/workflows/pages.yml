name: Preview gallery

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to build. Default the latest GitHub release.
        required: false
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The gallery shows the released package, not unreleased changes on main.
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_REF: ${{ inputs.ref }}
        run: echo "ref=${INPUT_REF:-$(gh release view --json tagName --jq .tagName)}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm preview

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .preview

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
